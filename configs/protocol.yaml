regime:
  start: '2019-01-01'
  end: '2020-01-01'
  amendment: Day-2 Kaggle mirror ended 2018-11-13, so the pre-registered 2019-06 window
    had 0 origins. Path B1 extends the span through 2020. The bank uses calendar 2019,
    the first full pre-COVID year inside that span.
frozen:
  embargo_hours: 336
  penalty_unmet: 1000.0
  penalty_unmet_headline: 25.0
  committed_k: 1
headline_rule:
  amended_at: '2026-10-25T12:15:00Z'
  text: A cost claim in the README states the headline M and the penalty share
    of the bill. A comparison whose penalty share is above 50% is not stated
    as a cost claim. The headline is the largest M in {10, 25, 100, 1000} at
    which both P3 and P4 stay under that share. 25 is the pre-registered
    candidate. It is not moved to make P3 beat P1.
imputation_v2:
  amended_at: '2026-10-25T12:15:00Z'
  rule: connection plus one draw from the empirical dwell CDF of the same
    station and Los Angeles hour, built from Caltech 2018 sessions with
    kWh > 0. The draw is the empirical quantile of a unit interval hashed
    from the session id. A stratum with fewer than 30 dwells falls back to
    the hour, then to the 2018 CDF. Energy stays kWhDelivered. A declared
    requestedDeparture is kept and is not replaced by the draw.
