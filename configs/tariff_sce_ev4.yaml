# SCE TOU-EV-4 energy and demand, effective 2019-03-01.
# Source: ACN-Sim schedule sce_tou_ev_4_march_2019, which is the rate family
# the PSCC Caltech experiments use.
# https://github.com/zach401/acnportal/blob/master/acnportal/signals/tariffs/tariff_schedules/sce_tou_ev_4_march_2019.json
# That file cites the SCE sheet https://www1.sce.com/NR/sc3/tm2/pdf/ce141-12.pdf
# Summer is June–September. Winter is October–May. Weekends are flat at the off-peak rate.
# Demand charge is 15.51 USD per kW and is the same in every season block of that JSON.
# These are not the later 4pm–9pm TOU-EV redesign.
timezone: America/Los_Angeles
currency: USD
rate_status: filed
demand_charge_per_kw_month: 15.51
windows:
