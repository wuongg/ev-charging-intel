name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly mini-pipeline. The same job also runs on push so the first commit is green.
    - cron: "0 7 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel uv
          uv export --frozen --format requirements-txt --no-emit-project --no-dev -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: ruff check src tests scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel uv
          uv export --frozen --format requirements-txt --no-emit-project --no-dev -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Pytest
        run: pytest -q

  mini-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel uv
          uv export --frozen --format requirements-txt --no-emit-project --no-dev -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ingest sample, audit, seasonal naive
        run: python scripts/mini_pipeline.py
